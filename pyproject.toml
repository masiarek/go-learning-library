[project]
name = "go-learning-library"
version = "0.1.0"
description = "A runnable learning library about Go, starting with its concurrency — goroutines, channels, select, sync, context, and the patterns and tools built on them — published as a searchable site."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
# The MkDocs site build. To change a docs dependency, edit here and run `uv lock`.
# mkdocs-same-dir is pinned exactly: it is the plugin that lets the docs root be
# the repo root, and it is the one most likely to break the whole build silently.
#
# Note what is NOT here: the examples have no dependencies at all. Each uses only
# its language's standard library, built by the compiler or run by the
# interpreter already on the machine.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
